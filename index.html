<style>
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#E9EFF1; --line:#CFDADE;
  --text:#101B1F; --muted:#5B6E75; --faint:#8E9DA3;
  --brand:#0E5460; --brand-ink:#FFFFFF;
  --arrest:#B42318; --arrest-bg:#FDECEA;
  --hems:#0B6E4F; --hems-bg:#E6F4EE;
  --rsi:#8A5A00; --rsi-bg:#FFF4DB;
  --focus:#1A7FE0;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1418; --surface:#122027; --surface-2:#182B34; --line:#264049;
    --text:#E7EFF2; --muted:#93A9B2; --faint:#607680;
    --brand:#4FC3D6; --brand-ink:#04191E;
    --arrest:#FF8A78; --arrest-bg:rgba(255,107,74,.10);
    --hems:#6FE0B6; --hems-bg:rgba(91,214,176,.10);
    --rsi:#F5C451; --rsi-bg:rgba(245,196,81,.10);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-feature-settings:"tnum" 1,"ss01" 1;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* sticky header */
.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top .wrap{padding-top:10px;padding-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:1 0 auto;min-width:52px;min-height:44px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);border-radius:10px;
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chip small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);line-height:1.1}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field input{
  width:100%;min-height:46px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--text);font:inherit;font-size:20px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.field input::placeholder{color:var(--faint);font-weight:400}
.field.search{grid-column:1/-1}
.field.search input{font-size:16px;font-weight:400}

.readout{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:44px}
.readout .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--brand);white-space:nowrap}
.readout .big small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.readout .note{font-size:13px;color:var(--muted);flex:1;min-width:0}
.readout .note b{color:var(--text)}
.btn{
  min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;
}
.btn:active{background:var(--surface-2)}

/* compact state */
.top.compact .expand{display:none}
.top:not(.compact) .slim{display:none}
.slim{display:flex;align-items:center;gap:10px;min-height:44px}
.slim .big{font-size:22px;font-weight:700;color:var(--brand);letter-spacing:-.01em;white-space:nowrap}
.slim .big small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.slim .meta{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.compact.editing .expand{display:block}
.top.compact.editing .slim{display:none}

/* sections */
.empty{padding:40px 0;text-align:center;color:var(--muted)}
section{margin-top:22px;scroll-margin-top:calc(70px + env(safe-area-inset-top))}
section h2{font-size:15px;font-weight:700;margin:0 0 2px;display:flex;align-items:center;gap:8px}
section h2 i{width:10px;height:10px;border-radius:3px;background:var(--brand);flex:none}
section .sub{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;
  padding:10px 12px;border-top:1px solid var(--line);
}
.row:first-child{border-top:0}
.row .name{grid-column:1;font-size:14px}
.row .dose{grid-column:1;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row .vol{grid-column:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .none{grid-column:1;font-size:13px;color:var(--faint);font-style:italic}
.row .dil{
  grid-column:2;grid-row:1/4;align-self:center;
  width:44px;height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--brand);font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.row .dil[aria-expanded=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.row .detail{
  grid-column:1/-1;margin-top:8px;padding:10px 12px;border-radius:8px;
  background:var(--surface-2);font-size:13.5px;color:var(--text)
}
.row .detail h4{margin:0 0 4px;font-size:13px}
.row .detail p{margin:0 0 6px}
.row .detail p:last-child{margin:0}
.row .detail .flag{color:var(--rsi);font-weight:600}
@media (prefers-color-scheme:dark){ .row .detail .flag{color:var(--rsi)} }

.arrest .card{border-color:color-mix(in srgb,var(--arrest) 45%,var(--line));background:var(--arrest-bg)}
.arrest h2 i{background:var(--arrest)}
.arrest .row .dose{color:var(--arrest)}
.hems h2 i{background:var(--hems)}
.hems .row .dose{color:var(--hems)}
.hems .scope{font-size:11.5px;color:var(--faint)}
.rsi h2 i{background:var(--rsi)}
.rsi .row .dose{color:var(--rsi)}
.rsi .card{background:var(--rsi-bg)}

.consult{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.consult span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);background:var(--surface)}
.consult span b{font-weight:600;color:var(--text)}

table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.hit td{background:color-mix(in srgb,var(--brand) 14%,var(--surface));font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid .card{padding:10px 12px}
.grid .card h3{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--muted)}
.grid .card .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.warn{margin-top:10px;padding:8px 12px;border-left:3px solid var(--arrest);background:var(--arrest-bg);font-size:12.5px;border-radius:0 8px 8px 0}
footer{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer p{margin:6px 0}

/* bottom nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:820px}
nav li{flex:1}
nav a{
  display:block;text-align:center;padding:9px 2px 8px;font-size:11px;font-weight:600;
  color:var(--muted);text-decoration:none;min-height:48px;
  -webkit-tap-highlight-color:transparent;
}
nav a i{display:block;width:22px;height:4px;border-radius:2px;margin:0 auto 5px;background:var(--line)}

  rule:"1–10 mcg/kg/hr (0.1–1 ml/kg/hr) of 10 mcg/ml, titrated to blood pressure.",
  prep:"Draw up 0.5 mg (0.5 ml) adrenaline into a 50 ml syringe and dilute to 50 ml with 0.9% NaCl — 10 mcg/ml."},
 {n:"Metaraminol infusion",scope:"ICP · CCP",calc:w=>`${f(.1*w)}–${f(.2*w)} ml/hr`,
  rule:"0.1–0.2 ml/kg/hr of metaraminol 0.1 mg/ml.",
  prep:"Add 10 mg (1 ml) metaraminol to a 100 ml bag of 0.9% NaCl. Draw 10 ml into a 10 ml syringe — 0.1 mg/ml.",
  flag:"Seek clinical advice on 0800HEMSMD before continuation or commencement."},
 {n:"Fentanyl infusion",scope:"ICP · CCP",calc:w=>`${f(.2*w)}–${f(.4*w)} ml/hr`,
  rule:"2–4 mcg/kg/hr (0.2–0.4 ml/kg/hr) of 10 mcg/ml.",
  prep:"Draw up 200 mcg (4 ml) into a 20 ml syringe and dilute to 20 ml with 0.9% NaCl — 10 mcg/ml."},
 {n:"Fentanyl / ketamine infusion",scope:"ICP · CCP",calc:w=>`start ${f(.2*w)}, max ${f(.5*w)} ml/hr`,
  rule:"Start 0.2 ml/kg/hr (fentanyl 2 mcg/kg/hr with ketamine 2 mg/kg/hr), up to 0.5 ml/kg/hr.",
  prep:"200 mcg fentanyl (4 ml) plus 200 mg ketamine (2 ml) into a 20 or 30 ml syringe, diluted to 20 ml with 0.9% NaCl — fentanyl 10 mcg/ml with ketamine 10 mg/ml."},
 {n:"Fentanyl / midazolam infusion",scope:"ICP · CCP",calc:w=>`start ${f(.2*w)}, max ${f(.5*w)} ml/hr`,
  rule:"Start 0.2 ml/kg/hr (fentanyl 2 mcg/kg/hr with midazolam 0.2 mg/kg/hr), up to 0.5 ml/kg/hr.",
  prep:"300 mcg fentanyl (6 ml) plus 30 mg midazolam (6 ml) into a 30 or 50 ml syringe, diluted to 30 ml with 0.9% NaCl — fentanyl 10 mcg/ml with midazolam 1 mg/ml."},
 {n:"Ketamine infusion",scope:"Paramedic · ICP · CCP",calc:w=>`load ${f(cap(.25*w,25))} mg · ${f(.5*w)}–${f(w)} ml/hr`,
  rule:"Loading dose up to 0.25 mg/kg (max 25 mg) over 15 minutes. Then 0.5 mg/kg/hr, up to 1 mg/kg/hr, of 1 mg/ml.",
  prep:"Add 100 mg (1 ml) ketamine to a 100 ml bag of 0.9% NaCl; draw into a 20 or 30 ml syringe — 1 mg/ml.",
  flag:"Contraindicated under one year of age."},
 {n:"Propofol infusion",scope:"ICP · CCP",calc:w=>`${f(cap(.2*w,20))}–${f(cap(.4*w,20))} ml/hr`,
  rule:"2–4 mg/kg/hr (0.2–0.4 ml/kg/hr) of 10 mg/ml, maximum 20 ml/hr.",
  prep:"Draw up 200 mg (20 ml) undiluted — 10 mg/ml.",
  flag:"Seek clinical advice on 0800HEMSMD before continuation or commencement."}
];
const CONSULT = [["Noradrenaline","not for paediatric use"],["Phenylephrine","not for paediatric use"],["Isoprenaline","not for paediatric use"],["GTN infusion","not for paediatric use"],["Hydralazine","not for paediatric use"],["Amiodarone infusion","not for paediatric use"],["Labetalol","consult 0800HEMSMD"],["Calcium chloride","consult 0800HEMSMD"],["Heparin","consult 0800HEMSMD"],["Insulin","consult 0800HEMSMD"]];

/* RSI — supplied by the user, not in either source document */
const RSI = [["Ketamine IV", w=>`${f(2*w)} mg`,"2 mg/kg"],["Rocuronium IV", w=>`${f(2*w)} mg`,"2 mg/kg"],["Fentanyl IV", w=>`${f(2*w)} mcg`,"2 mcg/kg"]];

const VITALS = [["Under 1 year","110–160","30–40","70–90"],["1–2 years","100–150","25–35","80–95"],["2–5 years","95–140","25–30","80–100"],["5–12 years","80–120","20–25","90–110"],["Over 12 years","60–100","15–20","100–120"]];
const BAND_AGE = {5:"under 1 year",10:"1 year",20:"2–5 years",30:"6–10 years",40:"11–13 years"};

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
const state = { weight:null, age:null, q:"", open:null, openH:null, editing:false };

function bandFor(w){ if(w==null||!(w>0)) return null; if(w>40) return "adult"; for(const b of [5,10,20,30,40]) if(w<=b) return b; return 40; }
function vitalsFor(a){ if(a==null||isNaN(a)) return null; if(a<1) return 0; if(a<2) return 1; if(a<5) return 2; if(a<12) return 3; return 4; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- render ---------- */
function rowHTML(r, band, sec){
  const cell = r.v[band];
  const key = sec+"|"+r.n;
  if(!cell) return `<div class="row"><span class="name">${esc(r.n)}</span><span class="none">Not in table at this weight</span></div>`;
  const [dose, vol, dil] = cell;
  const open = state.open===key;
  return `<div class="row">
    <span class="name">${esc(r.n)}</span>
    <span class="dose">${esc(dose)}</span>
    ${vol?`<span class="vol">${esc(vol)}</span>`:""}
    ${dil?`<button class="dil" type="button" data-key="${esc(key)}" data-dil="${dil}" aria-expanded="${open}" aria-label="Preparation ${dil} for ${esc(r.n)}">${dil}</button>`:""}
    ${open&&dil?`<div class="detail"><h4>${esc(DIL[dil][0])}</h4><p>${esc(DIL[dil][1])}</p></div>`:""}
  </div>`;
}

function section(id, cls, title, sub, body){
  return `<section id="s-${id}" class="${cls}"><h2><i></i>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}${body}</section>`;
}

function render(){
  const w = state.weight, a = state.age, band = bandFor(w);
  const has = band!==null, adult = band==="adult";
  const q = state.q.trim().toLowerCase();
  const match = r => !q || r.n.toLowerCase().includes(q);

  // chips
  document.querySelectorAll(".chip").forEach(c=>{
    const b = c.dataset.band==="adult"?"adult":Number(c.dataset.band);
    c.setAttribute("aria-pressed", String(has && band===b));
  });

  // readout
  let ro = "";
  if(!has){ ro = `<span class="note">Tap a band, or enter a weight or age.</span>`; }
  else if(adult){ ro = `<span class="big">Adult</span><span class="note">Over 40 kg — adult doses usually apply. Use judgement where a dose could harm, e.g. paracetamol. If in doubt, give the paediatric dose.</span>`; }
  else {
    const est = state.fromAge ? `Age ${f(a)} → estimated <b>${f(w)} kg</b> (formula tends to underestimate). ` : "";
    ro = `<span class="big">${band}<small>kg band</small></span><span class="note">${est}<b>${f(w)} kg</b> rounded up to the ${band} kg band, ${BAND_AGE[band]}. HEMS and RSI use the actual ${f(w)} kg.${w<5?" <b>Neonate</b> — low threshold for clinical advice.":""}</span>`;
  }
  $("#readout").innerHTML = ro;
  $("#slimBig").innerHTML = !has?"":adult?"Adult":`${band}<small>kg band</small>`;
  $("#slimMeta").textContent = !has?"No weight entered":adult?"over 40 kg":`${f(w)} kg · ${BAND_AGE[band]}${q?" · “"+state.q+"”":""}`;
  $("#slimBtn").textContent = has?"Change":"Enter weight";

  // main
  let html = "";
  if(!has){
    html = `<div class="empty">Doses appear here once a weight or age is entered.</div>
      <div class="warn">Uncontrolled copy. Check values against the current guideline at cpg.stjohn.org.nz. EAS doses are published band values, not per-kg calculations.</div>`;
  } else {
    if(!adult){
      html += section("arrest","arrest","Cardiac arrest","Defibrillation 4 J/kg, initial and subsequent. If the level is unavailable, select the next highest.",
        `<div class="card">${EAS.arrest.map(r=>rowHTML(r,band,"ar")).join("")}</div>`);
      let airExtra = "";
      if(a!=null && !isNaN(a)){
        const size = a<1?"3–4 mm":f(a/4+3.5)+" mm";
        const len = a<1?(`${f(6+w)} cm newborn · ETT size × 3`):f(a/2+12)+" cm";
        airExtra = `<div class="grid" style="margin-top:8px"><div class="card"><h3>ETT size from age</h3><div class="big">${size}</div></div><div class="card"><h3>Length at lips from age</h3><div class="big">${len}</div></div></div>`;
      }
      html += section("airway","","Airway","Children may need a different size than predicted.",
        `<div class="card">${EAS.airway.map(r=>rowHTML(r,band,"aw")).join("")}</div>${airExtra}`);
      const drugs = EAS.drugs.filter(match);
      html += section("drugs","","Drugs — EAS 7.2 band table",`Published values for the ${band} kg band. Tap a number for preparation.`,
        `<div class="card">${drugs.length?drugs.map(r=>rowHTML(r,band,"dr")).join(""):`<div class="row"><span class="none">Nothing matches “${esc(state.q)}”.</span></div>`}</div>`);
    }
    html += section("rsi","rsi","Rapid sequence intubation",`Calculated on ${f(w)} kg. These per-kg figures were supplied by you and are in neither source document — confirm against the RSI guideline.`,
      `<div class="card">${RSI.map(([n,c,rule])=>`<div class="row"><span class="name">${n} <span class="vol">${rule}</span></span><span class="dose">${c(w)}</span></div>`).join("")}</div>`);
    const hems = HEMS.filter(match);
    html += section("hems","hems","HEMS extensions",`Calculated on the actual ${f(w)} kg, not the band. Tap a row for rule and preparation.`,
      `<div class="card">${hems.length?hems.map(r=>{const open=state.openH===r.n;return `<div class="row">
        <span class="name">${esc(r.n)}<br><span class="scope">${esc(r.scope)}</span></span>
        <span class="dose">${esc(r.calc(w,a))}</span>
        <button class="dil" type="button" data-hems="${esc(r.n)}" aria-expanded="${open}" aria-label="Details for ${esc(r.n)}">${open?"–":"+"}</button>
        ${open?`<div class="detail"><h4>Rule</h4><p>${esc(r.rule)}</p><h4>Preparation</h4><p>${esc(r.prep)}</p>${r.flag?`<p class="flag">${esc(r.flag)}</p>`:""}</div>`:""}
      </div>`;}).join(""):`<div class="row"><span class="none">Nothing matches “${esc(state.q)}”.</span></div>`}</div>
      <div class="consult">${CONSULT.map(([n,s])=>`<span><b>${n}</b> — ${s}</span>`).join("")}</div>`);
    const vi = vitalsFor(a);
    html += section("vitals","","Vital signs", vi==null?"Enter an age to highlight a row.":"",
      `<table><thead><tr><th>Age</th><th>Heart rate</th><th>Resp rate</th><th>Systolic BP</th></tr></thead><tbody>${VITALS.map((r,i)=>`<tr class="${i===vi?"hit":""}">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    html += section("formulae","","Estimation formulae","",
      `<div class="grid">
        <div class="card"><h3>Weight, under 1 year</h3><div class="big">5 kg</div></div>
        <div class="card"><h3>Weight, 1–10 years</h3><div class="big">(age + 4) × 2</div></div>
        <div class="card"><h3>Weight, 11–14 years</h3><div class="big">age × 3</div></div>
        <div class="card"><h3>Cuffed ETT, 1 year and over</h3><div class="big">(age ÷ 4) + 3.5</div></div>
        <div class="card"><h3>Length at lips, newborn</h3><div class="big">6 + weight</div></div>
        <div class="card"><h3>Length at lips, 1 year and over</h3><div class="big">(age ÷ 2) + 12</div></div>
      </div>`);
    html += `<div class="warn">Uncontrolled copy. Check values against the current guideline at cpg.stjohn.org.nz. EAS doses are published band values, not per-kg calculations.</div>`;
  }
  html += `<footer>
    <p>CPG EAS 7.2 Paediatric Equipment and Drug Doses, St John New Zealand, version 1.0.5 (28 Oct 2024), export dated 03 Aug 2026. HEMS Clinical Ltd CPG Extensions to Standing Orders, version 1, 26 Jun 2026.</p>
    <p>The EAS tables do not carry all administration information; read with the medicines section of the comprehensive edition. Infant GCS omitted — not legible in the supplied file.</p>
    <p>Weight is deliberately not remembered between openings.</p>
    <p>Created by T Dale. This has not been cross referenced or validated. Not for operational use at this time.</p>
    <p>Last updated: 05/09/2026</p> 
  </footer>`;
  $("#main").innerHTML = html;
  $("#nav").hidden = !has || adult;
}

/* ---------- events ---------- */
function setFromWeight(v){ state.fromAge=false; state.weight = v===""?null:parseFloat(v); render(); }
function estimate(a){ if(a==null||isNaN(a)) return null; if(a<1) return 5; if(a<=10) return (a+4)*2; if(a<=14) return a*3; return null; }

$("#w").addEventListener("input", e=>{ setFromWeight(e.target.value); });
$("#a").addEventListener("input", e=>{
  state.age = e.target.value===""?null:parseFloat(e.target.value);
  if($("#w").value==="" && state.age!=null){ const est=estimate(state.age); if(est!=null){ state.weight=est; state.fromAge=true; } }
  render();
});
$("#q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click", ()=>{
  const b = c.dataset.band;
  const w = b==="adult"?45:Number(b);
  $("#w").value = w; state.fromAge=false; state.weight=w; render();
}));
$("#main").addEventListener("click", e=>{
  const d = e.target.closest(".dil"); if(!d) return;
  if(d.dataset.key!=null){ state.open = state.open===d.dataset.key?null:d.dataset.key; }
  if(d.dataset.hems!=null){ state.openH = state.openH===d.dataset.hems?null:d.dataset.hems; }
  render();
});
$("#slimBtn").addEventListener("click", ()=>{ state.editing=true; syncTop(); $("#doneWrap").hidden=false; });
$("#doneBtn").addEventListener("click", ()=>{ state.editing=false; syncTop(); });

let compact=false, tick=false;
function syncTop(){
  const t=$("#top");
  t.classList.toggle("compact", compact);
  t.classList.toggle("editing", compact && state.editing);
  $("#doneWrap").hidden = !(compact && state.editing);
}
window.addEventListener("scroll", ()=>{
  if(tick) return; tick=true;
  requestAnimationFrame(()=>{ tick=false; const c=window.scrollY>110; if(c!==compact){ compact=c; if(!c) state.editing=false; syncTop(); } });
},{passive:true});

// bottom nav highlight
const obs = new IntersectionObserver(entries=>{
  entries.forEach(en=>{ if(en.isIntersecting){ document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+en.target.id)); } });
},{rootMargin:"-40% 0px -55% 0px"});
new MutationObserver(()=>document.querySelectorAll("main section").forEach(s=>obs.observe(s))).observe($("#main"),{childList:true});

// offline: register the service worker if we are being served over http(s)
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
</script>
</body>
</html>
