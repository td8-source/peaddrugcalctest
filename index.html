<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#E9EFF1; --line:#CFDADE;
  --text:#101B1F; --muted:#5B6E75; --faint:#8E9DA3;
  --brand:#0E5460; --brand-ink:#FFFFFF;
  --arrest:#B42318; --arrest-bg:#FDECEA;
  --hems:#0B6E4F; --hems-bg:#E6F4EE;
  --rsi:#8A5A00; --rsi-bg:#FFF4DB;
  --focus:#1A7FE0;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1418; --surface:#122027; --surface-2:#182B34; --line:#264049;
    --text:#E7EFF2; --muted:#93A9B2; --faint:#607680;
    --brand:#4FC3D6; --brand-ink:#04191E;
    --arrest:#FF8A78; --arrest-bg:rgba(255,107,74,.10);
    --hems:#6FE0B6; --hems-bg:rgba(91,214,176,.10);
    --rsi:#F5C451; --rsi-bg:rgba(245,196,81,.10);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-feature-settings:"tnum" 1,"ss01" 1;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* Fixed header. It deliberately sits outside the document flow: a sticky
   header that changes height reflows everything below it mid-scroll, which
   is what made the compact transition judder (badly so on iOS momentum
   scrolling). Out of flow, its height can change without moving a pixel of
   page content. --h-expand/--h-slim are measured in JS (see measureTop). */
.top{
  position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
  height:calc(var(--h-expand,0px) + env(safe-area-inset-top) + 1px);
  transition:height .28s cubic-bezier(.16,1,.3,1);
}
.top.compact{height:calc(var(--h-slim,0px) + env(safe-area-inset-top) + 1px)}
.top.compact.editing{height:calc(var(--h-expand,0px) + env(safe-area-inset-top) + 1px)}
.top .wrap{position:relative;height:100%;overflow:hidden}
/* Holds page content clear of the resting (expanded) header. */
#main{padding-top:calc(var(--h-main,0px) + env(safe-area-inset-top) + 1px)}
/* Drives the compact toggle via IntersectionObserver instead of a scroll
   listener, so nothing runs on the main thread while scrolling. */
#sentinel{position:absolute;top:0;left:0;width:1px;height:130px;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:1 0 auto;min-width:52px;min-height:44px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);border-radius:10px;
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chip small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);line-height:1.1}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field input{
  width:100%;min-height:46px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--text);font:inherit;font-size:20px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.field input::placeholder{color:var(--faint);font-weight:400}
.field.search{grid-column:1/-1}
.field.search input{font-size:16px;font-weight:400}

.readout{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:44px}
.readout .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--brand);white-space:nowrap}
.readout .big small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.readout .note{font-size:13px;color:var(--muted);flex:1;min-width:0}
.readout .note b{color:var(--text)}
.btn{
  min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;
}
.btn:active{background:var(--surface-2)}

/* compact state — the two panels are stacked on top of each other and
   crossfade with opacity/transform only (both compositor-driven, so they
   can't desync from the scroll). Abs-positioned children ignore an
   ancestor's padding, so .wrap's old 10px/14px inset is restated here. */
.expand,.slim{
  position:absolute;top:10px;left:14px;right:14px;padding-bottom:10px;
  opacity:1;transition:opacity .18s ease,transform .28s cubic-bezier(.16,1,.3,1);
}
.slim{display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(-6px);pointer-events:none}
.slim .big{font-size:22px;font-weight:700;color:var(--brand);letter-spacing:-.01em;white-space:nowrap}
.slim .big small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.slim .meta{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.compact .expand{opacity:0;transform:translateY(-6px);pointer-events:none}
.top.compact .slim{opacity:1;transform:none;pointer-events:auto}
.top.compact.editing .expand{opacity:1;transform:none;pointer-events:auto}
.top.compact.editing .slim{opacity:0;transform:translateY(-6px);pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .top,.expand,.slim{transition:none}
}

/* sections */
.empty{padding:40px 0;text-align:center;color:var(--muted)}
section{margin-top:22px;scroll-margin-top:calc(70px + env(safe-area-inset-top))}
section h2{font-size:15px;font-weight:700;margin:0 0 2px;display:flex;align-items:center;gap:8px}
section h2 i{width:10px;height:10px;border-radius:3px;background:var(--brand);flex:none}
section .sub{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;
  padding:10px 12px;border-top:1px solid var(--line);
}
.row:first-child{border-top:0}
.row .name{grid-column:1;font-size:14px}
.row .dose{grid-column:1;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row .vol{grid-column:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .none{grid-column:1;font-size:13px;color:var(--faint);font-style:italic}
.row .dil{
  grid-column:2;grid-row:1/4;align-self:center;
  width:44px;height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--brand);font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.row .dil[aria-expanded=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.row .detail{
  grid-column:1/-1;margin-top:8px;padding:10px 12px;border-radius:8px;
  background:var(--surface-2);font-size:13.5px;color:var(--text)
}
.row .detail h4{margin:0 0 4px;font-size:13px}
.row .detail p{margin:0 0 6px}
.row .detail p:last-child{margin:0}
.row .detail .flag{color:var(--rsi);font-weight:600}
@media (prefers-color-scheme:dark){ .row .detail .flag{color:var(--rsi)} }

.arrest .card{border-color:color-mix(in srgb,var(--arrest) 45%,var(--line));background:var(--arrest-bg)}
.arrest h2 i{background:var(--arrest)}
.arrest .row .dose{color:var(--arrest)}
.hems h2 i{background:var(--hems)}
.hems .row .dose{color:var(--hems)}
.row .scope{font-size:11.5px;color:var(--faint)}
.rsi h2 i{background:var(--rsi)}
.rsi .row .dose{color:var(--rsi)}
.rsi .card{background:var(--rsi-bg)}

.consult{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.consult span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);background:var(--surface)}
.consult span b{font-weight:600;color:var(--text)}

table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.hit td{background:color-mix(in srgb,var(--brand) 14%,var(--surface));font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid .card{padding:10px 12px}
.grid .card h3{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--muted)}
.grid .card .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.warn{margin-top:10px;padding:8px 12px;border-left:3px solid var(--arrest);background:var(--arrest-bg);font-size:12.5px;border-radius:0 8px 8px 0}
/* shown only when the check built into the data block finds a problem */
.databad{margin:12px 0;padding:10px 14px;border:1px solid var(--arrest);background:var(--arrest-bg);border-radius:10px;font-size:13px}
.databad h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--arrest)}
.databad ul{margin:0;padding-left:18px}
footer{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer p{margin:6px 0}

/* bottom nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:820px}
nav li{flex:1}
nav a{
  display:block;text-align:center;padding:9px 2px 8px;font-size:11px;font-weight:600;
  color:var(--muted);text-decoration:none;min-height:48px;
  -webkit-tap-highlight-color:transparent;
}
nav a i{display:block;width:22px;height:4px;border-radius:2px;margin:0 auto 5px;background:var(--line)}
nav a.arr i{background:var(--arrest)} nav a.hem i{background:var(--hems)} nav a.rs i{background:var(--rsi)}
nav a.on{color:var(--text)}
nav[hidden]{display:none}

@media (min-width:640px){
  .fields{grid-template-columns:1fr 1fr 2fr}
  .field.search{grid-column:auto}
  .row{grid-template-columns:minmax(0,1fr) 9rem 12rem 44px}
  .row .name{grid-column:1;grid-row:1}
  .row .dose{grid-column:2;grid-row:1;font-size:17px}
  .row .vol,.row .none{grid-column:3;grid-row:1}
  .row .dil{grid-column:4;grid-row:1}
  .hems .row{grid-template-columns:minmax(0,1fr) 16rem 44px}
  .hems .row .dose,.hems .row .none{grid-column:2}.hems .row .dil{grid-column:3}
  .rsi .row{grid-template-columns:minmax(0,1fr) 16rem}
  .rsi .row .dose,.rsi .row .none{grid-column:2}
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }

<body>

<div id="sentinel" aria-hidden="true"></div>

<div class="top" id="top">
  <div class="wrap">
    <div class="slim">
      <span class="big" id="slimBig"></span>
      <span class="meta" id="slimMeta"></span>
      <button class="btn" id="slimBtn" type="button">Change</button>
    </div>
    <div class="expand">
      <!-- The weight buttons are built from BANDS in the script below. -->
      <div class="chips" role="group" aria-label="Weight band"></div>
      <div class="fields">
        <div class="field"><label for="w">Weight (kg)</label><input id="w" type="number" inputmode="decimal" min="0" step="0.1" placeholder="—" enterkeyhint="done"></div>
        <div class="field"><label for="a">Age (years)</label><input id="a" type="number" inputmode="decimal" min="0" max="18" step="0.5" placeholder="—" enterkeyhint="done"></div>
        <div class="field search"><label for="q">Find a drug</label><input id="q" type="search" placeholder="ketamine, TXA, midaz…" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
      </div>
      <div class="readout" id="readout"></div>
      <div id="doneWrap" hidden style="margin-top:8px"><button class="btn" id="doneBtn" type="button">Done</button></div>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>

<nav id="nav" hidden>
  <ul>
    <li><a href="#s-arrest" class="arr"><i></i>Arrest</a></li>
    <li><a href="#s-airway"><i></i>Airway</a></li>
    <li><a href="#s-drugs"><i></i>Drugs</a></li>
    <li><a href="#s-rsi" class="rs"><i></i>RSI</a></li>
    <li><a href="#s-hems" class="hem"><i></i>HEMS</a></li>
    <li><a href="#s-vitals"><i></i>Vitals</a></li>
  </ul>
</nav>

<script>
/* Helpers used by the dose rules below: f() trims a number to two decimal
   places, cap() applies a ceiling. */
const f = n => String(Math.round(n*100)/100);
const cap = (n,m) => Math.min(n,m);

/* ===========================================================================
   DATA  —  everything clinical lives between here and the END OF DATA marker.

   Changing a dose, adding a drug, retiring one, or moving to a new version of
   a source document should never need an edit below that marker. Nothing down
   there knows the name of any drug.

   After an edit, open the page. A red banner across the top lists anything
   the built-in check can see: an unknown preparation id, a weight band left
   out, a drug name used twice. No banner means the data is well formed — it
   does NOT mean the numbers are right. Check those against the source.

   When publishing the edit, bump `const C` in sw.js as well, or phones that
   already have the app will keep serving the old doses from their cache.
   See README.md.
   =========================================================================== */

/* --------------------------------------------------------------------------
   1. Source documents and the standing wording shown around the tables.
   -------------------------------------------------------------------------- */
const META = {
  easSource:   "St John New Zealand EAS Clinical Practice Guidelines, export dated 24 Sep 2026: paediatric doses from CPG EAS 7.2 Paediatric Equipment and Drug Doses, version 1.0.5 (28 Oct 2024); adult doses from the medicines section (14.x) and the analgesia, cardiac arrest, seizures, RSI (9.3) and post intubation (9.6) guidelines.",
  hemsSource:  "HEMS Clinical Ltd CPG Extensions to Standing Orders, version 1, 26 Jun 2026.",
  scopeNote:   "The EAS tables do not carry all administration information; read with the medicines section of the comprehensive edition. Infant GCS omitted — not legible in the supplied file.",
  authorNote:  "Created by T Dale. This has not been cross referenced or validated. Not for operational use at this time.",
  storageNote: "Weight is deliberately not remembered between openings.",
  lastUpdated: "28/09/2026",
  disclaimer:  "Uncontrolled copy. Check values against the current guideline at cpg.stjohn.org.nz. Paediatric EAS doses are published band values, not per-kg calculations. Adult doses are the fixed EAS doses, except where EAS gives them per kg."
};

/* Section headings and the grey line under each of them. The ones written as
   functions are handed the figure they need to quote. */
const TEXT = {

  noWeightMeta:  "No weight entered",
  empty:         "Doses appear here once a weight or age is entered.",

  noMatch:       q => `Nothing matches “${q}”.`,

                        : `Fixed adult doses. Enter a weight for the few that go by weight (ketamine, RSI, some infusions).`,

  drugsTitleAdult: "Drugs — EAS adult doses",
  drugsNoteAdult:  "Adult doses from the EAS medicines section and guidelines. Tap a number for preparation.",
  rsiTitle:      "Rapid sequence intubation",

  hemsNoteAdult: w => `Adult doses. Most are fixed; ${w ? `the few that go by weight use ${w} kg` : "enter a weight for the few that go by weight"}. Tap a row for rule and preparation.`,

};

/* --------------------------------------------------------------------------
   2. Weight bands.

   The EAS table is published against these bands. `kg` is both the band's
   name and its upper bound: a weight rounds up into the first band it fits.
   `chip` is the small label on the button at the top of the screen and `age`
   the wording used in the readout underneath.

   Add, remove or re-label a band here and the buttons, the rounding and the
   readout all follow. Anything heavier than the last band is an adult.
   -------------------------------------------------------------------------- */
const BANDS = [
  { kg:  5, chip: "&lt;1 yr", age: "under 1 year" },
  { kg: 10, chip: "1 yr",     age: "1 year"       },
  { kg: 20, chip: "2–5 yr",   age: "2–5 years"    },
  { kg: 30, chip: "6–10 yr",  age: "6–10 years"   },
  { kg: 40, chip: "11–13 yr", age: "11–13 years"  }
];

/* Tapping Adult deliberately enters no weight: most adult doses are fixed, and
   the ones that go by weight say so until a weight is typed in. */
const ADULT = {
  label:  "Adult",
  chip:   "&gt;40 kg",
  note:   "Over 40 kg — adult doses usually apply. Use judgement where a dose could harm, e.g. paracetamol. If in doubt, give the paediatric dose."
};

/* Below this weight the readout adds the neonate caution from TEXT above. */
const NEONATE_KG = 5;

/* --------------------------------------------------------------------------
   3. Preparations.

   Tapping the number beside a dose opens one of these. The number shown is
   simply the entry's position in this list, and drugs refer to a preparation
   by its id and never by its number — so a new preparation can be dropped in
   anywhere (the list is kept alphabetical) and the numbering re-flows on its
   own. Renaming an id means updating the drugs that quote it; the check on
   load will name any that were missed.

   Entries marked `adult: true` are the adult recipes the EAS medicines section
   gives where they differ from the paediatric ones. They are numbered on their
   own, A1, A2…, so the paediatric numbers keep matching the dilution numbers
   printed in the 7.2 table.
   -------------------------------------------------------------------------- */

  },
  "metaraminol-iv": {

  },

  },
  "midazolam-iv": {
    title: "Midazolam IV 1 mg/ml",

  },

    adult: true,
    title: "Midazolam IV 1 mg/ml — adult",
    steps: "Draw up 2 ml from a 15 mg/3 ml ampoule. Dilute to a total of 10 ml with 0.9% sodium chloride — 1 mg/ml. Give the dose as an IV bolus."
  },
  "morphine-iv": {
    title: "Morphine IV 1 mg/ml",
    steps: "Draw up 1 ml from a 10 mg/1 ml ampoule. Dilute to a total of 10 ml with 0.9% sodium chloride. Give the table volume as an IV bolus."
  },
  "naloxone-iv": {
    title: "Naloxone IV 0.1 mg/ml",

  }
};

/* --------------------------------------------------------------------------
   4. The EAS band table.

   Three tables: cardiac arrest, airway, and everything else. Every entry is

       { name: "Shown in the left column", bands: {
          5: [ dose, volume or detail, preparation id ],
         ...
       }}

     dose             the bold figure — "0.5 mg", "Size 3", "20 ml/kg"
     volume / detail  the small grey line beside it; "" when there is none
     preparation id   a key of PREPS above, or null when nothing is prepared
     a whole band     may be null, meaning the drug is not published at that
                      weight; the row then reads "Not in table at this weight"

   Every band in BANDS needs a line, so that a missing one is a typo the check
   on load can catch rather than a dose that silently disappears.

   `adult` is the line shown when Adult (over 40 kg) is selected. It comes from
   the adult doses in the EAS medicines section and guidelines, not from the
   7.2 table, and it is required on every row (null where EAS gives no adult
   dose). Most adult doses are fixed, so it is usually a plain line like the
   bands. Where the adult dose depends on weight, it is instead

       { rule: "0.2 mg/kg, max 20 mg",           shown until a weight is entered
         calc: w => [ dose, volume, preparation id ] }   worked out from it

   The airway rows carry adult: null because adult airway sizes are standard
   and the airway section is not shown for adults.

   Drugs are listed alphabetically. The search box matches on `name`.
   -------------------------------------------------------------------------- */
const EAS = {
  arrest: [
    { name: "Adrenaline IV", bands: {
       5: ["0.05 mg", "0.5 ml (1:10,000)", "adrenaline-1-10000"],
      10: ["0.1 mg",  "1 ml (1:10,000)",   "adrenaline-1-10000"],
      20: ["0.2 mg",  "2 ml (1:10,000)",   "adrenaline-1-10000"],

      40: ["0.4 mg",  "4 ml (1:10,000)",   "adrenaline-1-10000"],
   adult: ["1 mg", "1 ml (1 mg/ml, undiluted), every 4 min", null],
    }},
    { name: "Amiodarone IV", bands: {

      10: ["50 mg",  "1 ml (undiluted)",   null],
      20: ["100 mg", "2 ml (undiluted)",   null],
      30: ["150 mg", "3 ml (undiluted)",   null],
      40: ["200 mg", "4 ml (undiluted)",   null],
   adult: ["300 mg", "6 ml (undiluted) after 3 shocks; 150 mg after 6", null],
    }},

      10: ["40–50 J",   "", null],

      30: ["120–150 J", "", null],

    }}
  ],

       5: ["Size 1 (under 5 kg)", "Cuff inflation 4 ml",  null],

      20: ["Size 2 (10–20 kg)",   "Cuff inflation 10 ml", null],
      30: ["Size 3 (30–50 kg)",   "Cuff inflation 20 ml", null],
      40: ["Size 3 (30–50 kg)",   "Cuff inflation 20 ml", null],
   adult: null,
    }},

  ],

   adult: ["0.01 mg", "10 ml (1:1,000,000) every 1–2 min", "adrenaline-1-1000000"],

     flag   optional caution, shown in red under the preparation

const FORMULAE = {

  weightFromAge: a => a < 1 ? 5 : a <= 10 ? (a + 4) * 2 : a <= 14 ? a * 3 : null,

/* Preparations are numbered by their position in PREPS, so that inserting one
   renumbers the rest by itself. Adult ones count separately as A1, A2… */
const PREP_NO = {};
{ let n = 0, an = 0;
  Object.entries(PREPS).forEach(([id, p]) => { PREP_NO[id] = p.adult ? "A" + (++an) : String(++n); }); }

/* An EAS adult line is either fixed, or { rule, calc } worked out from the
   weight. Without a weight, a weight-based line shows its rule instead. */
function cellFor(r, band, w){
  const c = r.bands[band];
  if(c == null || Array.isArray(c)) return c;
  return w ? c.calc(w) : [c.rule, TEXT.needWeight, null];
}

/* Weights the load-time check tries every weight-based adult rule at, chosen
   to sit either side of the thresholds EAS uses (50, 60 and 80 kg). */
const SAMPLE_KG = [41, 49, 50, 60, 61, 80, 81, 150];

/* A quick read over the data on load. It cannot tell whether a dose is right,
   only whether the table is put together the way the rest of the file expects.
   Anything it finds is listed in a banner at the top of the screen. */
function checkData(){
  const problems = [], seen = new Set(), used = new Set();
  const checkCell = (where, cell) => {
    if(!Array.isArray(cell) || cell.length !== 3){
      problems.push(`${where}: expected [dose, volume, preparation id] or null.`);
      return;
    }
    const id = cell[2];
    if(id != null && !PREPS[id]) problems.push(`${where}: no preparation called “${id}”.`);
    if(id != null) used.add(id);
  };
  for(const [section, rows] of Object.entries(EAS)){
    rows.forEach(r => {
      const where = `EAS.${section} “${r.name}”`;
      if(!r.name) problems.push(`${section}: a row has no name.`);
      if(seen.has(r.name)) problems.push(`${where} appears twice.`);
      seen.add(r.name);
      BANDS.forEach(b => {
        if(!(b.kg in r.bands)) problems.push(`${where} has no ${b.kg} kg band — use null if it is not published at that weight.`);
      });
      if(!("adult" in r.bands)) problems.push(`${where} has no adult line — use null if EAS gives no adult dose.`);
      Object.entries(r.bands).forEach(([kg, cell]) => {
        if(cell === null) return;
        const at = kg === "adult" ? `${where}, adult` : `${where}, ${kg} kg`;
        if(kg === "adult" && !Array.isArray(cell)){
          if(typeof cell.rule !== "string" || typeof cell.calc !== "function"){
            problems.push(`${at}: expected a fixed line, or { rule, calc } for a dose that goes by weight.`);
            return;
          }
          SAMPLE_KG.forEach(w => checkCell(`${at} at ${w} kg`, cell.calc(w)));
          return;
        }
        checkCell(at, cell);
      });
    });
  }
  Object.keys(PREPS).forEach(id => {
    if(!used.has(id)) problems.push(`Preparation “${id}” is never used by any drug.`);
  });
  const hems = new Set();
  HEMS.forEach(r => {
    const where = `HEMS “${r.name}”`;
    if(hems.has(r.name)) problems.push(`${where} appears twice.`);
    hems.add(r.name);
    if(r.calc !== null && typeof r.calc !== "function") problems.push(`${where} has no calc function — use null if it is for adults only.`);
    if(r.calc && (typeof r.rule !== "string" || typeof r.prep !== "string")) problems.push(`${where} needs a rule and a prep for children.`);
    if(!("adult" in r)) { problems.push(`${where} has no adult entry — use null if it is for children only.`); return; }
    if(r.adult === null){
      if(!r.calc) problems.push(`${where} has neither a paediatric calc nor an adult entry.`);
      return;
    }
    const d = r.adult;
    if(typeof d.rule !== "string" || typeof d.prep !== "string") problems.push(`${where}: the adult entry needs a rule and a prep.`);
    if(typeof d.calc === "function"){
      SAMPLE_KG.forEach(w => { if(typeof d.calc(w, null) !== "string") problems.push(`${where}: the adult calc does not give a line of text at ${w} kg.`); });
    } else if(typeof d.calc !== "string") problems.push(`${where}: the adult calc must be a line of text, or a function of the weight.`);
  });
  RSI.forEach(d => {
    if(!(d.perKg > 0) || !(d.max > 0) || !d.unit) problems.push(`RSI “${d.name}” needs perKg, max and unit.`);
  });
  if(VITALS.length && VITALS[VITALS.length - 1].under !== null)
    problems.push("The last VITALS row must have under: null so that every age matches a row.");
  return problems;
}
const DATA_PROBLEMS = checkData();
if(DATA_PROBLEMS.length) console.warn("Data problems:\n" + DATA_PROBLEMS.join("\n"));

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
/* `adult` is set by the Adult button, which enters no weight of its own. */
const state = { weight:null, age:null, q:"", open:null, openH:null, editing:false, adult:false };

const TOP_BAND = BANDS[BANDS.length-1];
const bandAge = kg => (BANDS.find(b=>b.kg===kg)||{}).age || "";

/* Round a weight up into the first band it fits; anything above the top band
   is an adult, and so is no weight at all once Adult has been tapped. */
function bandFor(w){
  if(w==null||!(w>0)) return state.adult ? "adult" : null;
  if(w>TOP_BAND.kg) return "adult";
  for(const b of BANDS) if(w<=b.kg) return b.kg;
  return TOP_BAND.kg;
}
/* Index of the VITALS row an age falls in; the last row catches everything. */
function vitalsFor(a){
  if(a==null||isNaN(a)) return null;
  const i = VITALS.findIndex(r=>r.under!=null && a<r.under);
  return i===-1 ? VITALS.length-1 : i;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- render ---------- */
function rowHTML(r, band, sec, w){
  const cell = cellFor(r, band, w);
  const key = sec+"|"+r.name;
  if(!cell) return `<div class="row"><span class="name">${esc(r.name)}</span><span class="none">${band==="adult"?TEXT.noAdultDose:"Not in table at this weight"}</span></div>`;
  const [dose, vol, prepId] = cell;
  const prep = prepId ? PREPS[prepId] : null;
  const no = prep ? PREP_NO[prepId] : null;
  const open = state.open===key;
  return `<div class="row">
    <span class="name">${esc(r.name)}</span>
    <span class="dose">${esc(dose)}</span>
    ${vol?`<span class="vol">${esc(vol)}</span>`:""}
    ${prep?`<button class="dil" type="button" data-key="${esc(key)}" data-dil="${no}" aria-expanded="${open}" aria-label="Preparation ${no} for ${esc(r.name)}">${no}</button>`:""}
    ${open&&prep?`<div class="detail"><h4>${esc(prep.title)}</h4><p>${esc(prep.steps)}</p></div>`:""}
  </div>`;
}

/* One RSI row: the per-kg rule, capped, and for adults rounded where the
   guideline says so. Without a weight it shows only the rule. */
function rsiHTML(d, w, adult){
  const dose = perKg => {
    let v = cap(perKg*w, d.max);
    if(adult && d.adultRound) v = Math.round(v/d.adultRound)*d.adultRound;
    return `${f(v)} ${d.unit}`;
  };
  const notes = [];
  if(d.reduced) notes.push(`Reduce to ${d.reduced.perKg} ${d.unit}/kg${w?` (${dose(d.reduced.perKg)})`:""} ${d.reduced.when}.`);
  if(adult && d.adultRound) notes.push(`Rounded to the nearest ${d.adultRound} ${d.unit} for an adult.`);
  if(d.note) notes.push(d.note);
  return `<div class="row">
    <span class="name">${esc(d.name)} <span class="vol">${d.perKg} ${d.unit}/kg, max ${d.max} ${d.unit}</span>${notes.length?`<br><span class="scope">${esc(notes.join(" "))}</span>`:""}</span>
    ${w?`<span class="dose">${dose(d.perKg)}</span>`:`<span class="none">${TEXT.needWeight}</span>`}
  </div>`;
}

/* One HEMS row. For an adult it shows the drug's adult entry in place of the
   paediatric one; a weight-based adult dose waits for a weight. */
function hemsHTML(r, w, a, adult){
  const d = adult ? r.adult : r;
  const name = (adult && d && d.name) || r.name;
  if(!d) return `<div class="row"><span class="name">${esc(name)}<br><span class="scope">${esc(r.scope)}</span></span><span class="none">${TEXT.childOnly}</span></div>`;
  const byWeight = typeof d.calc === "function";
  const dose = !byWeight ? d.calc : (w ? d.calc(w,a) : null);
  const open = state.openH===r.name;
  return `<div class="row">
    <span class="name">${esc(name)}<br><span class="scope">${esc(r.scope)}</span></span>
    ${dose!=null?`<span class="dose">${esc(dose)}</span>`:`<span class="none">${TEXT.needWeight}</span>`}
    <button class="dil" type="button" data-hems="${esc(r.name)}" aria-expanded="${open}" aria-label="Details for ${esc(name)}">${open?"–":"+"}</button>
    ${open?`<div class="detail"><h4>Rule</h4><p>${esc(d.rule)}</p><h4>Preparation</h4><p>${esc(d.prep)}</p>${d.flag?`<p class="flag">${esc(d.flag)}</p>`:""}</div>`:""}
  </div>`;
}

function section(id, cls, title, sub, body){
  return `<section id="s-${id}" class="${cls}"><h2><i></i>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}${body}</section>`;
}

/* The weight buttons come from BANDS, so a change there changes the row. */
function buildChips(){
  const html = BANDS.map(b=>`<button class="chip" type="button" data-band="${b.kg}">${b.kg}<small>${b.chip}</small></button>`);
  html.push(`<button class="chip" type="button" data-band="adult">${ADULT.label}<small>${ADULT.chip}</small></button>`);
  $(".chips").innerHTML = html.join("");
}

function render(){
  const band = bandFor(state.weight), a = state.age;
  const w = state.weight>0 ? state.weight : null;
  const has = band!==null, adult = band==="adult";
  const q = state.q.trim().toLowerCase();
  const match = r => !q || r.name.toLowerCase().includes(q);
  const hemsName = r => (adult && r.adult && r.adult.name) || r.name;

  // chips
  document.querySelectorAll(".chip").forEach(c=>{
    const b = c.dataset.band==="adult"?"adult":Number(c.dataset.band);
    c.setAttribute("aria-pressed", String(has && band===b));
  });

  // readout
  let ro = "";
  if(!has){ ro = `<span class="note">${TEXT.noWeight}</span>`; }
  else if(adult){ ro = `<span class="big">${ADULT.label}</span><span class="note">${TEXT.adultReadout(w&&f(w))} ${ADULT.note}</span>`; }
  else {
    const est = state.fromAge ? TEXT.ageEstimate(f(a), f(w)) : "";
    ro = `<span class="big">${band}<small>kg band</small></span><span class="note">${est}${TEXT.bandReadout(band, f(w), bandAge(band))}${w<NEONATE_KG?TEXT.neonate:""}</span>`;
  }
  $("#readout").innerHTML = ro;
  $("#slimBig").innerHTML = !has?"":adult?ADULT.label:`${band}<small>kg band</small>`;
  $("#slimMeta").textContent = (!has?TEXT.noWeightMeta:adult?TEXT.adultMeta(TOP_BAND.kg, w&&f(w)):`${f(w)} kg · ${bandAge(band)}`)+(has&&q?" · “"+state.q+"”":"");
  $("#slimBtn").textContent = has?"Change":"Enter weight";

  // main
  let html = DATA_PROBLEMS.length
    ? `<div class="databad"><h3>${TEXT.dataProblems}</h3><ul>${DATA_PROBLEMS.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`
    : "";
  if(!has){
    html += `<div class="empty">${TEXT.empty}</div>
      <div class="warn">${META.disclaimer}</div>`;
  } else {
    const noMatch = `<div class="row"><span class="none">${TEXT.noMatch(esc(state.q))}</span></div>`;
    html += section("arrest","arrest",TEXT.arrestTitle,adult?TEXT.arrestNoteAdult:TEXT.arrestNote,
      `<div class="card">${EAS.arrest.map(r=>rowHTML(r,band,"ar",w)).join("")}</div>`);
    if(!adult){
      let airExtra = "";
      if(a!=null && !isNaN(a)){
        const size = FORMULAE.ettSize(a,w);
        const len = FORMULAE.ettLength(a,w);
        airExtra = `<div class="grid" style="margin-top:8px"><div class="card"><h3>ETT size from age</h3><div class="big">${size}</div></div><div class="card"><h3>Length at lips from age</h3><div class="big">${len}</div></div></div>`;
      }
      html += section("airway","",TEXT.airwayTitle,TEXT.airwayNote,
        `<div class="card">${EAS.airway.map(r=>rowHTML(r,band,"aw",w)).join("")}</div>${airExtra}`);
    }
    const drugs = EAS.drugs.filter(match);
    html += section("drugs","",adult?TEXT.drugsTitleAdult:TEXT.drugsTitle,adult?TEXT.drugsNoteAdult:TEXT.drugsNote(band),
      `<div class="card">${drugs.length?drugs.map(r=>rowHTML(r,band,"dr",w)).join(""):noMatch}</div>`);
    html += section("rsi","rsi",TEXT.rsiTitle,TEXT.rsiNote(w&&f(w)),
      `<div class="card">${RSI.map(d=>rsiHTML(d,w,adult)).join("")}</div>`);
    // Adult-only drugs have no paediatric calc; children see them in the CONSULT strip instead.
    const hems = HEMS.filter(r => (adult || r.calc) && (!q || hemsName(r).toLowerCase().includes(q)));
    html += section("hems","hems",TEXT.hemsTitle,adult?TEXT.hemsNoteAdult(w&&f(w)):TEXT.hemsNote(f(w)),
      `<div class="card">${hems.length?hems.map(r=>hemsHTML(r,w,a,adult)).join(""):noMatch}</div>
      ${adult?"":`<div class="consult">${CONSULT.map(c=>`<span><b>${c.name}</b> — ${c.note}</span>`).join("")}</div>`}`);
    const vi = vitalsFor(a);
    html += section("vitals","",TEXT.vitalsTitle, vi==null?TEXT.vitalsNote:"",
      `<table><thead><tr><th>Age</th><th>Heart rate</th><th>Resp rate</th><th>Systolic BP</th></tr></thead><tbody>${VITALS.map((r,i)=>`<tr class="${i===vi?"hit":""}">${[r.age,r.hr,r.rr,r.sbp].map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    html += section("formulae","",TEXT.formulaeTitle,"",
      `<div class="grid">
        ${FORMULAE.cards.map(c=>`<div class="card"><h3>${c.label}</h3><div class="big">${c.value}</div></div>`).join("\n        ")}
      </div>`);
    html += `<div class="warn">${META.disclaimer}</div>`;
  }
  html += `<footer>
    <p>${META.easSource} ${META.hemsSource}</p>
    <p>${META.scopeNote}</p>
    <p>${META.authorNote}</p>
    <p>Last updated: ${META.lastUpdated}</p> 
    <p>${META.storageNote}</p>
  </footer>`;
  $("#main").innerHTML = html;
  $("#nav").hidden = !has;
  $('#nav a[href="#s-airway"]').parentElement.hidden = adult;
  measureTop();
}

/* ---------- events ---------- */
/* A child's weight cancels the Adult button; clearing the weight while in
   adult mode goes back to adult doses with no weight. */
function setWeight(w){ state.weight = w; if(w>0 && w<=TOP_BAND.kg) state.adult = false; }
function setFromWeight(v){ state.fromAge=false; setWeight(v===""?null:parseFloat(v)); render(); }
function estimate(a){ if(a==null||isNaN(a)) return null; return FORMULAE.weightFromAge(a); }

$("#w").addEventListener("input", e=>{ setFromWeight(e.target.value); });
$("#a").addEventListener("input", e=>{
  state.age = e.target.value===""?null:parseFloat(e.target.value);
  if($("#w").value==="" && state.age!=null){ const est=estimate(state.age); if(est!=null){ setWeight(est); state.fromAge=true; } }
  render();
});
$("#q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
buildChips();
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click", ()=>{
  const b = c.dataset.band;
  state.fromAge = false;
  if(b==="adult"){ $("#w").value = ""; state.weight = null; state.adult = true; }
  else { $("#w").value = b; setWeight(Number(b)); }
  render();
}));

$("#main").addEventListener("click", e=>{
  const d = e.target.closest(".dil"); if(!d) return;
  if(d.dataset.key!=null){ state.open = state.open===d.dataset.key?null:d.dataset.key; }
  if(d.dataset.hems!=null){ state.openH = state.openH===d.dataset.hems?null:d.dataset.hems; }
  render();
});
$("#slimBtn").addEventListener("click", ()=>{ state.editing=true; syncTop(); $("#doneWrap").hidden=false; });
$("#doneBtn").addEventListener("click", ()=>{ state.editing=false; syncTop(); });

let compact=false;
const topEl = $("#top"), expandEl = $(".expand"), slimEl = $(".slim");
const TOP_INSET = 10; // must match .expand/.slim's `top` offset in CSS

/* The header is fixed, so its height drives nothing but itself — but it
   still has to know how tall each panel wants to be, and #main still needs
   to clear the resting (expanded) header. Both are measured here, and only
   ever on a real content or width change — never during a scroll. */
/* animate=true only for the compact toggle. A content-driven resize has to
   be instant, because #main's padding tracks the same number and can't be
   transitioned without laying out the whole page every frame — animating one
   and snapping the other would briefly overlap content with the header. */
function measureTop(animate){
  if(!animate) topEl.style.transition = "none";
  const he = TOP_INSET + expandEl.offsetHeight;
  const s = document.documentElement.style;
  s.setProperty("--h-expand", he+"px");
  s.setProperty("--h-slim", (TOP_INSET + slimEl.offsetHeight)+"px");
  // Only while the form is genuinely at rest at the top: updating this while
  // compact would shift page content out from under someone scrolled away.
  if(!compact) s.setProperty("--h-main", he+"px");
  if(!animate){ void topEl.offsetHeight; topEl.style.transition = ""; }
}

function syncTop(){
  topEl.classList.toggle("compact", compact);
  topEl.classList.toggle("editing", compact && state.editing);
  $("#doneWrap").hidden = !(compact && state.editing);
  measureTop(true); // the Done button changes how tall .expand is
}

// A 130px sentinel at the top of the document: once it's scrolled out of
// view we go compact. Fires only when it crosses the edge, so unlike a
// scroll listener there's no per-frame work while scrolling.
new IntersectionObserver(([e])=>{
  const c = !e.isIntersecting;
  if(c===compact) return;
  compact = c;
  if(!c) state.editing = false;
  syncTop();
}).observe($("#sentinel"));

// iOS fires resize constantly as the URL bar collapses during scroll; only a
// width change (rotation) can actually alter how tall the panels are.
let lastW = window.innerWidth;
window.addEventListener("resize", ()=>{
  if(window.innerWidth===lastW) return;
  lastW = window.innerWidth;
  measureTop();
},{passive:true});

// bottom nav highlight
const obs = new IntersectionObserver(entries=>{
  entries.forEach(en=>{ if(en.isIntersecting){ document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+en.target.id)); } });
},{rootMargin:"-40% 0px -55% 0px"});
new MutationObserver(()=>document.querySelectorAll("main section").forEach(s=>obs.observe(s))).observe($("#main"),{childList:true});

// offline: register the service worker if we are being served over http(s)
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
</script>
</body>
</html>
