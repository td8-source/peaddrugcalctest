<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#E9EFF1; --line:#CFDADE;
  --text:#101B1F; --muted:#5B6E75; --faint:#8E9DA3;
  --brand:#0E5460; --brand-ink:#FFFFFF;
  --arrest:#B42318; --arrest-bg:#FDECEA;
  --hems:#0B6E4F; --hems-bg:#E6F4EE;
  --rsi:#8A5A00; --rsi-bg:#FFF4DB;
  --focus:#1A7FE0;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1418; --surface:#122027; --surface-2:#182B34; --line:#264049;
    --text:#E7EFF2; --muted:#93A9B2; --faint:#607680;
    --brand:#4FC3D6; --brand-ink:#04191E;
    --arrest:#FF8A78; --arrest-bg:rgba(255,107,74,.10);
    --hems:#6FE0B6; --hems-bg:rgba(91,214,176,.10);
    --rsi:#F5C451; --rsi-bg:rgba(245,196,81,.10);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-feature-settings:"tnum" 1,"ss01" 1;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* sticky header */
.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top .wrap{position:relative;overflow:hidden;transition:height .32s cubic-bezier(.16,1,.3,1)}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:1 0 auto;min-width:52px;min-height:44px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);border-radius:10px;
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chip small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);line-height:1.1}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field input{
  width:100%;min-height:46px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--text);font:inherit;font-size:20px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.field input::placeholder{color:var(--faint);font-weight:400}
.field.search{grid-column:1/-1}
.field.search input{font-size:16px;font-weight:400}

.readout{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:44px}
.readout .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--brand);white-space:nowrap}
.readout .big small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.readout .note{font-size:13px;color:var(--muted);flex:1;min-width:0}
.readout .note b{color:var(--text)}
.btn{
  min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;
}
.btn:active{background:var(--surface-2)}

/* compact state — .expand/.slim are stacked on top of each other (not
   swapped in flow) and crossfade opacity, while .wrap's own height (set
   from JS, see setTopHeight) morphs between the two. Stacking them avoids
   the moment where both panels are simultaneously taking up their own flow
   space mid-transition, which caused a faint squeeze as they passed.
   Abs-positioned children ignore an ancestor's padding, so the 10px/14px
   inset that used to live on .wrap is restated here to match. */
.expand,.slim{position:absolute;top:10px;left:14px;right:14px;padding-bottom:10px;opacity:1;transition:opacity .2s ease}
.slim{display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none}
.slim .big{font-size:22px;font-weight:700;color:var(--brand);letter-spacing:-.01em;white-space:nowrap}
.slim .big small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.slim .meta{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){
  .top .wrap,.expand,.slim{transition:none}
}

/* sections */
.empty{padding:40px 0;text-align:center;color:var(--muted)}
section{margin-top:22px;scroll-margin-top:calc(70px + env(safe-area-inset-top))}
section h2{font-size:15px;font-weight:700;margin:0 0 2px;display:flex;align-items:center;gap:8px}
section h2 i{width:10px;height:10px;border-radius:3px;background:var(--brand);flex:none}
section .sub{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;
  padding:10px 12px;border-top:1px solid var(--line);
}
.row:first-child{border-top:0}
.row .name{grid-column:1;font-size:14px}
.row .dose{grid-column:1;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row .vol{grid-column:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .none{grid-column:1;font-size:13px;color:var(--faint);font-style:italic}
.row .dil{
  grid-column:2;grid-row:1/4;align-self:center;
  width:44px;height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--brand);font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.row .dil[aria-expanded=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.row .detail{
  grid-column:1/-1;margin-top:8px;padding:10px 12px;border-radius:8px;
  background:var(--surface-2);font-size:13.5px;color:var(--text)
}
.row .detail h4{margin:0 0 4px;font-size:13px}
.row .detail p{margin:0 0 6px}
.row .detail p:last-child{margin:0}
.row .detail .flag{color:var(--rsi);font-weight:600}
@media (prefers-color-scheme:dark){ .row .detail .flag{color:var(--rsi)} }

.arrest .card{border-color:color-mix(in srgb,var(--arrest) 45%,var(--line));background:var(--arrest-bg)}
.arrest h2 i{background:var(--arrest)}
.arrest .row .dose{color:var(--arrest)}
.hems h2 i{background:var(--hems)}
.hems .row .dose{color:var(--hems)}
.hems .scope{font-size:11.5px;color:var(--faint)}
.rsi h2 i{background:var(--rsi)}
.rsi .row .dose{color:var(--rsi)}
.rsi .card{background:var(--rsi-bg)}

.consult{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.consult span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);background:var(--surface)}
.consult span b{font-weight:600;color:var(--text)}

table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.hit td{background:color-mix(in srgb,var(--brand) 14%,var(--surface));font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid .card{padding:10px 12px}
.grid .card h3{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--muted)}
.grid .card .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.warn{margin-top:10px;padding:8px 12px;border-left:3px solid var(--arrest);background:var(--arrest-bg);font-size:12.5px;border-radius:0 8px 8px 0}
/* shown only when the check built into the data block finds a problem */
.databad{margin:12px 0;padding:10px 14px;border:1px solid var(--arrest);background:var(--arrest-bg);border-radius:10px;font-size:13px}
.databad h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--arrest)}
.databad ul{margin:0;padding-left:18px}
footer{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer p{margin:6px 0}

/* bottom nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:820px}
nav li{flex:1}
nav a{
  display:block;text-align:center;padding:9px 2px 8px;font-size:11px;font-weight:600;
  color:var(--muted);text-decoration:none;min-height:48px;
  -webkit-tap-highlight-color:transparent;
}
nav a i{display:block;width:22px;height:4px;border-radius:2px;margin:0 auto 5px;background:var(--line)}
nav a.arr i{background:var(--arrest)} nav a.hem i{background:var(--hems)} nav a.rs i{background:var(--rsi)}
nav a.on{color:var(--text)}
nav[hidden]{display:none}

@media (min-width:640px){
  .fields{grid-template-columns:1fr 1fr 2fr}
  .field.search{grid-column:auto}
  .row{grid-template-columns:minmax(0,1fr) 9rem 12rem 44px}
  .row .name{grid-column:1;grid-row:1}
  .row .dose{grid-column:2;grid-row:1;font-size:17px}
  .row .vol,.row .none{grid-column:3;grid-row:1}
  .row .dil{grid-column:4;grid-row:1}
  .hems .row{grid-template-columns:minmax(0,1fr) 16rem 44px}
  .hems .row .dose{grid-column:2}.hems .row .dil{grid-column:3}
  .rsi .row{grid-template-columns:minmax(0,1fr) 16rem}
  .rsi .row .dose{grid-column:2}
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }

<body>

<div class="top" id="top">
  <div class="wrap">
    <div class="slim">
      <span class="big" id="slimBig"></span>
      <span class="meta" id="slimMeta"></span>
      <button class="btn" id="slimBtn" type="button">Change</button>
    </div>
    <div class="expand">
      <!-- The weight buttons are built from BANDS in the script below. -->
      <div class="chips" role="group" aria-label="Weight band"></div>
      <div class="fields">
        <div class="field"><label for="w">Weight (kg)</label><input id="w" type="number" inputmode="decimal" min="0" step="0.1" placeholder="—" enterkeyhint="done"></div>
        <div class="field"><label for="a">Age (years)</label><input id="a" type="number" inputmode="decimal" min="0" max="18" step="0.5" placeholder="—" enterkeyhint="done"></div>
        <div class="field search"><label for="q">Find a drug</label><input id="q" type="search" placeholder="ketamine, TXA, midaz…" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
      </div>
      <div class="readout" id="readout"></div>
      <div id="doneWrap" hidden style="margin-top:8px"><button class="btn" id="doneBtn" type="button">Done</button></div>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>

<nav id="nav" hidden>
  <ul>
    <li><a href="#s-arrest" class="arr"><i></i>Arrest</a></li>
    <li><a href="#s-airway"><i></i>Airway</a></li>
    <li><a href="#s-drugs"><i></i>Drugs</a></li>

</nav>

/* ===========================================================================
   DATA  —  everything clinical lives between here and the END OF DATA marker.

   Changing a dose, adding a drug, retiring one, or moving to a new version of
   a source document should never need an edit below that marker. Nothing down
   there knows the name of any drug.

   After an edit, open the page. A red banner across the top lists anything
   the built-in check can see: an unknown preparation id, a weight band left
   out, a drug name used twice. No banner means the data is well formed — it
   does NOT mean the numbers are right. Check those against the source.

   When publishing the edit, bump `const C` in sw.js as well, or phones that
   already have the app will keep serving the old doses from their cache.
   See README.md.
   =========================================================================== */

   -------------------------------------------------------------------------- */

/* Preparations are numbered by their position in PREPS, so that inserting one
   renumbers the rest by itself. */
const PREP_NO = {};
Object.keys(PREPS).forEach((id, i) => { PREP_NO[id] = i + 1; });

/* A quick read over the data on load. It cannot tell whether a dose is right,
   only whether the table is put together the way the rest of the file expects.
   Anything it finds is listed in a banner at the top of the screen. */
function checkData(){
  const problems = [], seen = new Set();
  for(const [section, rows] of Object.entries(EAS)){
    rows.forEach(r => {
      const where = `EAS.${section} “${r.name}”`;
      if(!r.name) problems.push(`${section}: a row has no name.`);
      if(seen.has(r.name)) problems.push(`${where} appears twice.`);
      seen.add(r.name);
      BANDS.forEach(b => {
        if(!(b.kg in r.bands)) problems.push(`${where} has no ${b.kg} kg band — use null if it is not published at that weight.`);
      });
      Object.entries(r.bands).forEach(([kg, cell]) => {
        if(cell === null) return;
        if(!Array.isArray(cell) || cell.length !== 3){
          problems.push(`${where}, ${kg} kg: expected [dose, volume, preparation id] or null.`);
          return;
        }
        const id = cell[2];
        if(id != null && !PREPS[id]) problems.push(`${where}, ${kg} kg: no preparation called “${id}”.`);
      });
    });
  }
  const used = new Set();
  Object.values(EAS).forEach(rows => rows.forEach(r =>
    Object.values(r.bands).forEach(c => { if(c && c[2]) used.add(c[2]); })));
  Object.keys(PREPS).forEach(id => {
    if(!used.has(id)) problems.push(`Preparation “${id}” is never used by any drug.`);
  });
  const hems = new Set();
  HEMS.forEach(r => {
    if(hems.has(r.name)) problems.push(`HEMS “${r.name}” appears twice.`);
    hems.add(r.name);
    if(typeof r.calc !== "function") problems.push(`HEMS “${r.name}” has no calc function.`);
  });
  if(VITALS.length && VITALS[VITALS.length - 1].under !== null)
    problems.push("The last VITALS row must have under: null so that every age matches a row.");
  return problems;
}
const DATA_PROBLEMS = checkData();
if(DATA_PROBLEMS.length) console.warn("Data problems:\n" + DATA_PROBLEMS.join("\n"));

/* ---------- state ---------- */
const $ = s => document.querySelector(s);

const TOP_BAND = BANDS[BANDS.length-1];
const bandAge = kg => (BANDS.find(b=>b.kg===kg)||{}).age || "";

/* Round a weight up into the first band it fits; anything above the top band
   is an adult. */
function bandFor(w){
  if(w==null||!(w>0)) return null;
  if(w>TOP_BAND.kg) return "adult";
  for(const b of BANDS) if(w<=b.kg) return b.kg;
  return TOP_BAND.kg;
}
/* Index of the VITALS row an age falls in; the last row catches everything. */
function vitalsFor(a){
  if(a==null||isNaN(a)) return null;
  const i = VITALS.findIndex(r=>r.under!=null && a<r.under);
  return i===-1 ? VITALS.length-1 : i;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function rowHTML(r, band, sec){
  const cell = r.bands[band];
  const key = sec+"|"+r.name;
  if(!cell) return `<div class="row"><span class="name">${esc(r.name)}</span><span class="none">Not in table at this weight</span></div>`;
  const [dose, vol, prepId] = cell;
  const prep = prepId ? PREPS[prepId] : null;
  const no = prep ? PREP_NO[prepId] : null;
  const open = state.open===key;
  return `<div class="row">
    <span class="name">${esc(r.name)}</span>
    <span class="dose">${esc(dose)}</span>
    ${vol?`<span class="vol">${esc(vol)}</span>`:""}
    ${prep?`<button class="dil" type="button" data-key="${esc(key)}" data-dil="${no}" aria-expanded="${open}" aria-label="Preparation ${no} for ${esc(r.name)}">${no}</button>`:""}
    ${open&&prep?`<div class="detail"><h4>${esc(prep.title)}</h4><p>${esc(prep.steps)}</p></div>`:""}
  </div>`;
}

function section(id, cls, title, sub, body){
  return `<section id="s-${id}" class="${cls}"><h2><i></i>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}${body}</section>`;
}

/* The weight buttons come from BANDS, so a change there changes the row. */
function buildChips(){
  const html = BANDS.map(b=>`<button class="chip" type="button" data-band="${b.kg}">${b.kg}<small>${b.chip}</small></button>`);
  html.push(`<button class="chip" type="button" data-band="adult">${ADULT.label}<small>${ADULT.chip}</small></button>`);
  $(".chips").innerHTML = html.join("");
}

function render(){
  const w = state.weight, a = state.age, band = bandFor(w);
  const has = band!==null, adult = band==="adult";
  const q = state.q.trim().toLowerCase();
  const match = r => !q || r.name.toLowerCase().includes(q);

  // chips
  document.querySelectorAll(".chip").forEach(c=>{
    const b = c.dataset.band==="adult"?"adult":Number(c.dataset.band);
    c.setAttribute("aria-pressed", String(has && band===b));
  });

  // readout
  let ro = "";
  if(!has){ ro = `<span class="note">${TEXT.noWeight}</span>`; }
  else if(adult){ ro = `<span class="big">${ADULT.label}</span><span class="note">${ADULT.note}</span>`; }
  else {
    const est = state.fromAge ? TEXT.ageEstimate(f(a), f(w)) : "";
    ro = `<span class="big">${band}<small>kg band</small></span><span class="note">${est}${TEXT.bandReadout(band, f(w), bandAge(band))}${w<NEONATE_KG?TEXT.neonate:""}</span>`;
  }
  $("#readout").innerHTML = ro;
  $("#slimBig").innerHTML = !has?"":adult?ADULT.label:`${band}<small>kg band</small>`;
  $("#slimMeta").textContent = !has?TEXT.noWeightMeta:adult?TEXT.adultMeta(TOP_BAND.kg):`${f(w)} kg · ${bandAge(band)}${q?" · “"+state.q+"”":""}`;
  $("#slimBtn").textContent = has?"Change":"Enter weight";

  // main
  let html = DATA_PROBLEMS.length
    ? `<div class="databad"><h3>${TEXT.dataProblems}</h3><ul>${DATA_PROBLEMS.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`
    : "";
  if(!has){
    html += `<div class="empty">${TEXT.empty}</div>
      <div class="warn">${META.disclaimer}</div>`;
  } else {
    if(!adult){
      html += section("arrest","arrest",TEXT.arrestTitle,TEXT.arrestNote,
        `<div class="card">${EAS.arrest.map(r=>rowHTML(r,band,"ar")).join("")}</div>`);
      let airExtra = "";
      if(a!=null && !isNaN(a)){
        const size = FORMULAE.ettSize(a,w);
        const len = FORMULAE.ettLength(a,w);
        airExtra = `<div class="grid" style="margin-top:8px"><div class="card"><h3>ETT size from age</h3><div class="big">${size}</div></div><div class="card"><h3>Length at lips from age</h3><div class="big">${len}</div></div></div>`;
      }
      html += section("airway","",TEXT.airwayTitle,TEXT.airwayNote,
        `<div class="card">${EAS.airway.map(r=>rowHTML(r,band,"aw")).join("")}</div>${airExtra}`);
      const drugs = EAS.drugs.filter(match);
      html += section("drugs","",TEXT.drugsTitle,TEXT.drugsNote(band),
        `<div class="card">${drugs.length?drugs.map(r=>rowHTML(r,band,"dr")).join(""):`<div class="row"><span class="none">${TEXT.noMatch(esc(state.q))}</span></div>`}</div>`);
    }
    html += section("rsi","rsi",TEXT.rsiTitle,TEXT.rsiNote(f(w)),
      `<div class="card">${RSI.map(d=>`<div class="row"><span class="name">${d.name} <span class="vol">${d.perKg} ${d.unit}/kg</span></span><span class="dose">${f(d.perKg*w)} ${d.unit}</span></div>`).join("")}</div>`);
    const hems = HEMS.filter(match);
    html += section("hems","hems",TEXT.hemsTitle,TEXT.hemsNote(f(w)),
      `<div class="card">${hems.length?hems.map(r=>{const open=state.openH===r.name;return `<div class="row">
        <span class="name">${esc(r.name)}<br><span class="scope">${esc(r.scope)}</span></span>
        <span class="dose">${esc(r.calc(w,a))}</span>
        <button class="dil" type="button" data-hems="${esc(r.name)}" aria-expanded="${open}" aria-label="Details for ${esc(r.name)}">${open?"–":"+"}</button>
        ${open?`<div class="detail"><h4>Rule</h4><p>${esc(r.rule)}</p><h4>Preparation</h4><p>${esc(r.prep)}</p>${r.flag?`<p class="flag">${esc(r.flag)}</p>`:""}</div>`:""}
      </div>`;}).join(""):`<div class="row"><span class="none">${TEXT.noMatch(esc(state.q))}</span></div>`}</div>
      <div class="consult">${CONSULT.map(c=>`<span><b>${c.name}</b> — ${c.note}</span>`).join("")}</div>`);
    const vi = vitalsFor(a);
    html += section("vitals","",TEXT.vitalsTitle, vi==null?TEXT.vitalsNote:"",
      `<table><thead><tr><th>Age</th><th>Heart rate</th><th>Resp rate</th><th>Systolic BP</th></tr></thead><tbody>${VITALS.map((r,i)=>`<tr class="${i===vi?"hit":""}">${[r.age,r.hr,r.rr,r.sbp].map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    html += section("formulae","",TEXT.formulaeTitle,"",
      `<div class="grid">
        ${FORMULAE.cards.map(c=>`<div class="card"><h3>${c.label}</h3><div class="big">${c.value}</div></div>`).join("\n        ")}
      </div>`);
    html += `<div class="warn">${META.disclaimer}</div>`;
  }
  html += `<footer>
    <p>${META.easSource} ${META.hemsSource}</p>
    <p>${META.scopeNote}</p>
    <p>${META.authorNote}</p>
    <p>Last updated: ${META.lastUpdated}</p> 
    <p>${META.storageNote}</p>
  </footer>`;
  $("#main").innerHTML = html;
  $("#nav").hidden = !has || adult;
  syncTopHeight();
}

/* ---------- events ---------- */
function setFromWeight(v){ state.fromAge=false; state.weight = v===""?null:parseFloat(v); render(); }
function estimate(a){ if(a==null||isNaN(a)) return null; return FORMULAE.weightFromAge(a); }

$("#w").addEventListener("input", e=>{ setFromWeight(e.target.value); });
$("#a").addEventListener("input", e=>{
  state.age = e.target.value===""?null:parseFloat(e.target.value);
  if($("#w").value==="" && state.age!=null){ const est=estimate(state.age); if(est!=null){ state.weight=est; state.fromAge=true; } }
  render();
});
$("#q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
buildChips();
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click", ()=>{
  const b = c.dataset.band;
  const w = b==="adult"?ADULT.weight:Number(b);
  $("#w").value = w; state.fromAge=false; state.weight=w; render();
}));

$("#main").addEventListener("click", e=>{
  const d = e.target.closest(".dil"); if(!d) return;
  if(d.dataset.key!=null){ state.open = state.open===d.dataset.key?null:d.dataset.key; }
  if(d.dataset.hems!=null){ state.openH = state.openH===d.dataset.hems?null:d.dataset.hems; }
  render();
});
$("#slimBtn").addEventListener("click", ()=>{ state.editing=true; syncTop(); $("#doneWrap").hidden=false; });
$("#doneBtn").addEventListener("click", ()=>{ state.editing=false; syncTop(); });

let compact=false, tick=false, expandShown=true;
const topWrap = $("#top .wrap");
const TOP_INSET = 10; // must match .expand/.slim's `top` offset in CSS
// .expand and .slim overlay each other (see CSS); the only thing that
// actually needs to be driven from JS is .wrap's own height, since abs-
// positioned children don't contribute to their parent's auto height.
function panelHeight(el){ return TOP_INSET + el.scrollHeight; }
function setTopHeight(px, animate){
  if(animate){ topWrap.style.height = px+"px"; return; }
  topWrap.style.transition = "none";
  topWrap.style.height = px+"px";
  void topWrap.offsetHeight;
  topWrap.style.transition = "";
}
// Keeps .wrap sized to whichever panel is currently showing, e.g. after the
// readout/slim summary text changes length. Not animated — this is a content
// resize, not a compact/expand toggle.
function syncTopHeight(){
  setTopHeight(panelHeight(expandShown ? $(".expand") : $(".slim")), false);
}
function syncTop(){
  const t=$("#top");
  t.classList.toggle("compact", compact);
  t.classList.toggle("editing", compact && state.editing);
  $("#doneWrap").hidden = !(compact && state.editing);
  const showExpand = !compact || state.editing;
  if(showExpand===expandShown) return;
  expandShown = showExpand;
  const expand=$(".expand"), slim=$(".slim");
  expand.style.opacity = showExpand?"1":"0";
  expand.style.pointerEvents = showExpand?"auto":"none";
  slim.style.opacity = showExpand?"0":"1";
  slim.style.pointerEvents = showExpand?"none":"auto";
  setTopHeight(panelHeight(showExpand?expand:slim), true);
}
window.addEventListener("scroll", ()=>{
  if(tick) return; tick=true;
  requestAnimationFrame(()=>{
    tick=false;
    const y=window.scrollY, c = compact ? y>70 : y>130; // hysteresis: avoids flicker right at the boundary
    if(c!==compact){ compact=c; if(!c) state.editing=false; syncTop(); }
  });
},{passive:true});
window.addEventListener("resize", syncTopHeight, {passive:true});

// bottom nav highlight
const obs = new IntersectionObserver(entries=>{
  entries.forEach(en=>{ if(en.isIntersecting){ document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+en.target.id)); } });
},{rootMargin:"-40% 0px -55% 0px"});
new MutationObserver(()=>document.querySelectorAll("main section").forEach(s=>obs.observe(s))).observe($("#main"),{childList:true});

// offline: register the service worker if we are being served over http(s)
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
</script>
</body>
</html>
